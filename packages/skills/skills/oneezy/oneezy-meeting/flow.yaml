agents:
  max: 0
steps:
- id: select-meeting
  does: Keep the requested scope and period; use the explicit meeting choice, otherwise show the seven-item menu and wait.
  outcome:
    done: one meeting type selected
    input: the user chooses a valid meeting type or clarifies an ambiguous selection
- id: read-template
  after: select-meeting
  does: Read shared rules and only the selected meeting template.
  needs:
  - references/shared-rules.md
  - selected meeting template
  outcome:
    done: the selected template and its evidence and period rules are known
- id: resolve-sources
  after: read-template
  does: Honor supplied-update-only requests; otherwise discover relevant dependencies, invocation policy, tools and authorized
    source access.
  needs:
  - references/source-routing.md
  outcome:
    done: relevant usable evidence sources identified
    input: a source identity or necessary connection cannot be resolved
- id: gather-evidence
  after: resolve-sources
  does: Read relevant evidence for the selected period and source scope; preserve conflicts and coverage limits without unauthorized
    writes.
  outcome:
    done: enough evidence exists to draft a supported report
    input: ask only the selected template questions or missing choices that materially affect the report
- id: prepare-report
  after: gather-evidence
  does: Fill the selected template with verified outcomes, actual status, source links and concrete next steps; mark unknowns
    and suggestions.
  outcome:
    done: a complete draft follows the unchanged meeting layout
- id: verify-and-return
  after: prepare-report
  does: Check timezone, covered period, readiness claims, attribution, evidence coverage and authorization; correct mismatches
    and return the meeting.
  returns: the selected meeting report
  outcome:
    done: the factual report is on screen with its numbered lists, supported statuses and Next Steps
