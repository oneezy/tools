# automerge: a pull request into dev merges itself once its checks pass, with no review and no tap (Justin's call,
# 2026-10-06: "go and do it until it's done ... I wake up to everything merged into dev"). Agents open the pull
# request and stop; the merge happens here, so no agent ever merges. Same gate as oneezy/skills' land workflow: who
# can push a branch to this repository.
#
#   - Every ready pull request into dev from a branch of this repository. A draft waits: keep a pull request in
#     draft to hold it. Pull requests from forks never merge here.
#   - Checks on the merged result, on Windows (the primary host, AGENTS.md): pnpm install, pnpm check, pnpm test.
#     Red merges nothing.
#   - A pull request that changes .github/ is never merged here, so this workflow cannot widen itself: workflow
#     changes take a person's merge. The run stays green and says so.
#   - Squash merge with PROJECT_PAT, so task-manager sees the merge and closes the ticket (a merge made with
#     GITHUB_TOKEN starts no workflow); GITHUB_TOKEN when the secret is missing.
#   - main is never touched: promotions stay pull requests a person merges.
name: automerge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [dev]

permissions: {}

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # as in publish-skills-sync.yml: LF checkouts in the tests' temp repos, and a long-named temp folder
      - name: git keeps line endings, temp has a long name
        run: |
          git config --system core.autocrlf false
          git config --global core.autocrlf false
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Vite Plus, then Node from .node-version and pnpm from packageManager (as vp env does on a PC)
      - uses: voidzero-dev/setup-vp@v1.9.0
        with:
          version: 1.0.0
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Check and test
        run: |
          vp install --frozen-lockfile
          pnpm check
          pnpm test

      - name: Does it change .github
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touched=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' | grep '^\.github/' || true)
          if [[ -n "$touched" ]]; then
            echo "::notice title=automerge skipped::#$PR changes .github/ ($(echo $touched)); a person merges workflow changes"
            echo "merge=false" >> "$GITHUB_OUTPUT"
          else
            echo "merge=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge into dev
        if: steps.scope.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT || github.token }}
        run: gh pr merge "$PR" --squash --match-head-commit "$HEAD_SHA" --repo "$GITHUB_REPOSITORY"
