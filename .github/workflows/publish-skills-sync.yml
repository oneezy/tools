# publish-skills-sync: publishes packages/skills-sync to npm as @oneezy/skills-sync whenever main carries a version
# npm does not have yet. Nobody runs `npm login` or answers a 2FA prompt: npm trusted publishing (OIDC) lets this
# workflow, and only this workflow, publish the package, with a provenance statement tying each version to its commit.
#
# Runs on every push to main that touches the package or this file, and by hand from the Actions tab
# (workflow_dispatch, e.g. to retry). A pull request touching them runs the same build, tests and guard and publishes
# nothing. A version already on npm is skipped, so a promotion that does not bump `version` in
# packages/skills-sync/package.json publishes nothing. Windows, the primary host (AGENTS.md): the junction tests in
# test/build.test.ts only pass there, and `prepublishOnly` reruns the whole suite.
#
# The guard (oneezy/skills ADR-0008): every machine runs `@oneezy/skills-sync@latest`, so a broken version on npm
# would reach all of them at once. Before publishing, the new build runs against a fresh checkout of oneezy/skills
# main, the library it serves: `refresh --frozen` installs the lock, `build --check` and `check` prove that the
# committed plugins and generated files are what this version builds, and `sync --plan` on an empty pretend machine,
# against the latest release on GitHub, proves that a first machine sync plans without error (a plan writes nothing).
# A failing step fails the job under its own name, and nothing publishes.
#
# One-time setup on npmjs.com (works from a phone): @oneezy/skills-sync -> Settings -> Trusted Publisher ->
# GitHub Actions, organization or user `oneezy`, repository `tools`, workflow filename `publish-skills-sync.yml`,
# environment empty. No NPM_TOKEN secret is used or needed.
name: publish-skills-sync

on:
  push:
    branches: [main]
    paths:
      - packages/skills-sync/**
      - .github/workflows/publish-skills-sync.yml
  pull_request:
    paths:
      - packages/skills-sync/**
      - .github/workflows/publish-skills-sync.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-skills-sync-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/skills-sync
    env:
      # the guard's library checkout, relative to the working directory above: actions/checkout places a repository
      # only under the workspace, so it sits beside packages/
      LIBRARY: ../../skills-main
    steps:
      # The runner's Git sets core.autocrlf true; the tests' own temp repos and clones must keep LF, as a
      # contributor's checkout does (README: a package holds LF). System level, because the CLI children the tests
      # spawn run with a temp HOME and never read the global config.
      # The runner's default TEMP is an 8.3 short path (C:\Users\RUNNER~1) on another drive than the checkout; the
      # tests compare paths under temp folders with the real ones, so they get the runner's long-named temp folder.
      - name: git keeps line endings, temp has a long name
        working-directory: .
        run: |
          git config --system core.autocrlf false
          git config --global core.autocrlf false
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Vite Plus, then Node from .node-version and pnpm from packageManager (as vp env does on a PC).
      # Dependencies are installed below, only when something will build.
      - uses: voidzero-dev/setup-vp@v1.9.0
        with:
          version: 1.0.0
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          run-install: false

      - name: npm 11.5.1 or later (trusted publishing)
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" || npm install -g npm@^11.5.1
          node --version
          npm --version
          pnpm --version

      # A pull request builds, tests and guards the version and publishes nothing. A push or dispatch publishes it
      # unless npm has it already, in which case nothing below runs.
      - name: Publish this version, or only test and guard it
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "pull request: @oneezy/skills-sync $v is built, tested and guarded, not published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "guard=true" >> "$GITHUB_OUTPUT"
          elif npm view "@oneezy/skills-sync@$v" version >/dev/null 2>&1; then
            echo "@oneezy/skills-sync $v is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "guard=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "guard=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.version.outputs.guard == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.version.outputs.guard == 'true'
        run: pnpm run build

      - name: Test (pull request)
        if: github.event_name == 'pull_request'
        run: pnpm test

      # The guard's library: oneezy/skills main, the release every machine syncs from. Read-only here; the frozen
      # refresh writes only its gitignored working set (upstream/, .agents/skills/).
      - name: Check out oneezy/skills main
        if: steps.version.outputs.guard == 'true'
        uses: actions/checkout@v5
        with:
          repository: oneezy/skills
          ref: main
          path: skills-main
          persist-credentials: false

      # The guard: one command of the built CLI per step, so the step that fails names what broke. Library commands
      # keep their flags across versions; a machine command accepts an old flag with a warning, so these keep working.
      - name: Guard, refresh --frozen (the lock installs)
        if: steps.version.outputs.guard == 'true'
        run: node dist/src/cli.js refresh --frozen --repo "$LIBRARY"

      - name: Guard, build --check (the committed plugins are what this version builds)
        if: steps.version.outputs.guard == 'true'
        run: node dist/src/cli.js build --check --repo "$LIBRARY"

      - name: Guard, check (the library is consistent)
        if: steps.version.outputs.guard == 'true'
        run: node dist/src/cli.js check --repo "$LIBRARY"

      # An empty pretend machine: a home under the runner's temp folder with bare .claude and .codex folders and no
      # claude or codex CLI on PATH, like a fresh PC. The machine sync reads the latest release of oneezy/skills on
      # GitHub (the token keeps it off the anonymous rate limit) and --plan prints what a first sync would do, writing
      # nothing; the sync needs no library and keeps nothing on the machine. HOME is for the tool, USERPROFILE for Node
      # on Windows, the two config folders for the harness table. The CLI runs on the real node binary, as the tests do
      # (process.execPath): a version manager's node shim would look for its runtime under the pretend home. A conflict
      # in the plan (GitHub unreachable, a bad release) exits 1, as for a user.
      - name: Guard, sync --plan on an empty machine
        if: steps.version.outputs.guard == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          machine="$RUNNER_TEMP/skills-sync-machine"
          mkdir -p "$machine/.claude" "$machine/.codex"
          node_bin="$(node -p 'process.execPath')"
          HOME="$machine" USERPROFILE="$machine" CLAUDE_CONFIG_DIR="$machine/.claude" CODEX_HOME="$machine/.codex" \
            "$node_bin" dist/src/cli.js sync --plan --json

      - name: Publish (prepublishOnly builds and runs the tests)
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public --provenance

      # From the runner's temp folder: inside packages/skills-sync, npx resolves the package to this folder's own
      # package.json, whose bin is never linked, and fails with "'skills-sync' is not recognized".
      - name: Verify
        if: steps.version.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          v="${{ steps.version.outputs.version }}"
          # A version lookup can propagate before npm exec's packument. Verify the runnable package
          # with a fresh manifest lookup on every retry, not only the version endpoint.
          verified=false
          for i in $(seq 1 60); do
            if [ "$(npm view --prefer-online @oneezy/skills-sync@$v version 2>/dev/null)" = "$v" ] &&
              npx --yes --prefer-online "@oneezy/skills-sync@$v" --help > skills-sync-help.txt; then
              verified=true
              break
            fi
            sleep 10
          done
          [ "$verified" = true ]
          npm view "@oneezy/skills-sync@$v" version
          head -n 1 skills-sync-help.txt
