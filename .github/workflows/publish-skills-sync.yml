# publish-skills-sync: publishes packages/skills-sync to npm as @oneezy/skills-sync whenever main carries a version
# npm does not have yet. Nobody runs `npm login` or answers a 2FA prompt: npm trusted publishing (OIDC) lets this
# workflow, and only this workflow, publish the package, with a provenance statement tying each version to its commit.
#
# Runs on every push to main that touches the package or this file, and by hand from the Actions tab
# (workflow_dispatch, e.g. to retry). A pull request touching them runs the same build and tests and publishes
# nothing. A version already on npm is skipped, so a promotion that does not bump `version` in
# packages/skills-sync/package.json publishes nothing. Windows, the primary host (AGENTS.md): the junction tests in
# test/build.test.ts only pass there, and `prepublishOnly` reruns the whole suite.
#
# One-time setup on npmjs.com (works from a phone): @oneezy/skills-sync -> Settings -> Trusted Publisher ->
# GitHub Actions, organization or user `oneezy`, repository `tools`, workflow filename `publish-skills-sync.yml`,
# environment empty. No NPM_TOKEN secret is used or needed.
name: publish-skills-sync

on:
  push:
    branches: [main]
    paths:
      - packages/skills-sync/**
      - .github/workflows/publish-skills-sync.yml
  pull_request:
    paths:
      - packages/skills-sync/**
      - .github/workflows/publish-skills-sync.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-skills-sync-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/skills-sync
    steps:
      # The runner's Git sets core.autocrlf true; the tests' own temp repos and clones must keep LF, as a
      # contributor's checkout does (README: a package holds LF). System level, because the CLI children the tests
      # spawn run with a temp HOME and never read the global config.
      # The runner's default TEMP is an 8.3 short path (C:\Users\RUNNER~1) on another drive than the checkout; the
      # tests compare paths under temp folders with the real ones, so they get the runner's long-named temp folder.
      - name: git keeps line endings, temp has a long name
        working-directory: .
        run: |
          git config --system core.autocrlf false
          git config --global core.autocrlf false
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Vite Plus, then Node from .node-version and pnpm from packageManager (as vp env does on a PC).
      # Dependencies are installed below, only when something will build.
      - uses: voidzero-dev/setup-vp@v1.9.0
        with:
          version: 1.0.0
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          run-install: false

      - name: npm 11.5.1 or later (trusted publishing)
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" || npm install -g npm@^11.5.1
          node --version
          npm --version
          pnpm --version

      - name: Build and test (pull request)
        if: github.event_name == 'pull_request'
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - name: Is this version on npm yet
        if: github.event_name != 'pull_request'
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if npm view "@oneezy/skills-sync@$v" version >/dev/null 2>&1; then
            echo "@oneezy/skills-sync $v is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish (prepublishOnly builds and runs the tests)
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public --provenance

      # From the runner's temp folder: inside packages/skills-sync, npx resolves the package to this folder's own
      # package.json, whose bin is never linked, and fails with "'skills-sync' is not recognized".
      - name: Verify
        if: steps.version.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          v="${{ steps.version.outputs.version }}"
          # npm takes a few minutes to serve a new version ("being processed"); 0.4.0 took about three
          for i in $(seq 1 60); do
            [ "$(npm view @oneezy/skills-sync@$v version 2>/dev/null)" = "$v" ] && break
            sleep 10
          done
          npm view "@oneezy/skills-sync@$v" version
          npx --yes "@oneezy/skills-sync@$v" --help | head -n 1
