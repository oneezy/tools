<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__TITLE__</title>
<style>
  :root {
    --bg: #fafafa; --panel: #ffffff; --ink: #1f2428; --muted: #6b7280; --line: #e5e7eb; --accent: #1565c0;
    --auto: #e6f4ea; --auto-ink: #2e7d32; --manual: #fff1e0; --manual-ink: #e65100; --background: #ede7f6; --background-ink: #5e35b1;
    --warn: #d32f2f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  header .counts { color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12px; }
  .legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid; }
  .legend .ln { display: inline-block; width: 26px; border-top: 2px solid; vertical-align: 3px; margin-right: 4px; }
  .legend .ln.dash { border-top-style: dashed; }
  .legend .ln.dot { border-top-style: dotted; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-left: auto; }
  .toolbar label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  button { font: inherit; font-size: 12px; padding: 4px 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  main { display: grid; grid-template-columns: 260px 1fr 340px; min-height: 0; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside input { margin: 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  #list { overflow: auto; margin: 0; padding: 0 0 12px; list-style: none; }
  #list li { padding: 7px 12px; cursor: pointer; border-left: 3px solid transparent; }
  #list li:hover { background: #f3f4f6; }
  #list li.active { border-left-color: var(--accent); background: #eef4fb; }
  #list li .nm { font-weight: 600; }
  #list li .ds { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; border: 1px solid; }
  .dot.auto { background: var(--auto); border-color: var(--auto-ink); }
  .dot.manual { background: var(--manual); border-color: var(--manual-ink); }
  .dot.background { background: var(--background); border-color: var(--background-ink); }
  #canvas { overflow: auto; padding: 16px; position: relative; }
  #canvas .mermaid { transform-origin: 0 0; display: inline-block; }
  #canvas svg { max-width: none !important; display: block; }
  #err { color: var(--warn); white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
  #detail { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 14px 16px; }
  #detail h2 { font-size: 16px; margin: 0 0 4px; }
  #detail h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
  #detail .badge { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 10px; border: 1px solid; margin-right: 6px; }
  #detail .badge.auto { background: var(--auto); border-color: var(--auto-ink); color: var(--auto-ink); }
  #detail .badge.manual { background: var(--manual); border-color: var(--manual-ink); color: var(--manual-ink); }
  #detail .badge.background { background: var(--background); border-color: var(--background-ink); color: var(--background-ink); }
  #detail .badge.entry { background: #fff; border-color: var(--manual-ink); color: var(--manual-ink); font-weight: 600; }
  #detail .badge.sub { background: #fff; border-color: var(--muted); color: var(--muted); }
  #detail p.desc { margin: 8px 0; }
  #detail .edge { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; }
  #detail .edge .t { font-weight: 600; cursor: pointer; color: var(--accent); }
  #detail .edge .k { font-size: 11px; color: var(--muted); margin-left: 6px; }
  #detail .edge .w { color: var(--warn); font-size: 11px; margin-left: 6px; }
  #detail .ev { font-family: ui-monospace, monospace; font-size: 11px; color: #374151; background: #f6f8fa; padding: 4px 6px; border-radius: 4px; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  #detail .ev b { color: var(--accent); }
  #detail code { font-size: 12px; background: #f6f8fa; padding: 1px 4px; border-radius: 3px; }
  #detail .path { font-size: 11px; color: var(--muted); word-break: break-all; }
  #detail details { margin-top: 8px; }
  #detail pre { font-size: 11px; background: #f6f8fa; padding: 8px; border-radius: 6px; overflow: auto; }
  /* fixed-size skill cards inside the diagram (HTML labels) */
  .sk { width: 176px; height: 66px; overflow: hidden; text-align: left; line-height: 1.25; padding: 0 2px; white-space: normal; }
  .sk * { white-space: normal; }
  .sk-name { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sk-desc { font-size: 10.5px; color: #4b5563; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-height: 27px; word-break: break-word; }
  .sk-mode { font-size: 9.5px; color: #6b7280; text-transform: uppercase; letter-spacing: .05em; }
  .sk-inst .sk-name { font-weight: 600; }
  .node { cursor: pointer; }
  .node:hover rect { filter: brightness(0.96); }
  #unresolved { font-size: 12px; color: var(--muted); }
  #watch { font-size: 11px; color: var(--muted); }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; } aside { max-height: 30vh; } #detail { max-height: 40vh; } }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <span class="counts" id="counts"></span>
  <span class="legend">
    <span><i class="sw" style="background:var(--auto);border-color:var(--auto-ink)"></i>auto (agent or /slash)</span>
    <span><i class="sw" style="background:var(--manual);border-color:var(--manual-ink)"></i>manual-only (/slash)</span>
    <span><i class="sw" style="background:var(--background);border-color:var(--background-ink)"></i>model-only (hidden)</span>
    <span>▶ entry point</span><span>↳ sub-skill</span>
    <span><i class="ln" style="border-color:#1565c0"></i>calls</span>
    <span><i class="ln dash" style="border-color:#6a1b9a"></i>suggests</span>
    <span><i class="ln" style="border-color:#2e7d32;border-top-width:3px"></i>needs first</span>
    <span><i class="ln dot" style="border-color:#9e9e9e"></i>reference</span>
    <span><i class="ln" style="border-color:#d32f2f"></i>⚠ calls a manual-only skill</span>
  </span>
  <span class="toolbar">
    <label><input type="checkbox" id="optFlows" checked /> flows</label>
    <label><input type="checkbox" id="optSug" /> suggests</label>
    <label><input type="checkbox" id="optRefs" /> references</label>
    <label><input type="checkbox" id="optFiles" /> files</label>
    <label><input type="checkbox" id="optTB" /> top-down</label>
    <button id="btnAll">Whole library</button>
    <button id="btnFit" title="fit the diagram to the window">Fit</button>
    <button id="btnZoomOut">−</button>
    <button id="btnZoomIn">+</button>
    <span id="zoomPct" style="font-size:12px;color:var(--muted);min-width:3em">100%</span>
    <button id="btnCopy">Copy Mermaid</button>
    <button id="btnMmd">Download .mmd</button>
    <button id="btnJson">Download graph.json</button>
    <span id="watch"></span>
  </span>
</header>
<main>
  <aside>
    <input id="search" type="search" placeholder="Search skills…" autofocus />
    <ul id="list"></ul>
  </aside>
  <section id="canvas"><div id="err"></div><div class="mermaid" id="diagram"></div></section>
  <section id="detail"><p class="path">Click a skill in the list or the diagram. The whole library is shown until you do.</p><div id="unresolved"></div></section>
</main>

<script type="application/json" id="graph-data">__GRAPH_JSON__</script>
<script type="module">
__MERMAID_MODULE__
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

const graph = JSON.parse(document.getElementById("graph-data").textContent);
const WATCH = __WATCH__;
const byId = new Map(graph.nodes.map((n) => [n.id, n]));
const state = { focus: null, flows: true, suggests: null, references: false, files: false, direction: "LR" };
let renderSeq = 0;

mermaid.initialize({
  startOnLoad: false,
  securityLevel: "loose",
  theme: "base",
  themeVariables: { fontFamily: "system-ui, sans-serif", primaryColor: "#e6f4ea", lineColor: "#455a64", fontSize: "13px" },
  flowchart: { htmlLabels: true, useMaxWidth: false, nodeSpacing: 28, rankSpacing: 48, curve: "basis", padding: 12 },
  maxTextSize: 900000, maxEdges: 5000,
});

window.skillClick = (nodeId) => {
  // n_<id> for skill nodes; flowN_M for instances
  let id = null;
  if (nodeId.startsWith("n_")) id = graph.nodes.find((n) => nid(n.id) === nodeId)?.id ?? null;
  else {
    const m = /^flow(\d+)_(\d+)$/.exec(nodeId);
    if (m) {
      const flows = visibleFlows();
      const f = flows[Number(m[1]) - 1];
      id = f ? f.steps[Number(m[2]) - 1] : null;
    }
  }
  if (id) select(id);
};

function visibleFlows() {
  const o = currentOptions();
  const keepType = (t) => (t === "reference" ? o.references : t === "suggests" ? (o.suggests ?? !!o.focus) : true);
  const included = o.focus ? neighborhood(graph, o.focus, o.depth, keepType) : new Set(graph.nodes.map((n) => n.id));
  return o.flows ? graph.flows.filter((f) => included.has(f.owner) && (!o.focus || f.owner === o.focus || f.steps.includes(o.focus))) : [];
}

function currentOptions() {
  return { html: true, focus: state.focus, depth: 2, flows: state.flows, suggests: state.suggests ?? undefined, references: state.references, files: state.files, direction: state.direction };
}

async function render() {
  const seq = ++renderSeq;
  const code = toMermaid(graph, currentOptions());
  const el = document.getElementById("diagram");
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    const { svg, bindFunctions } = await mermaid.render("svg" + seq, code);
    if (seq !== renderSeq) return;
    el.innerHTML = svg;
    bindFunctions?.(el);
    fit();
  } catch (e) {
    err.textContent = "Mermaid could not render this view:\n" + (e?.message ?? e) + "\n\n" + code.slice(0, 2000);
  }
}

function syncSuggestBox() {
  const box = document.getElementById("optSug");
  box.checked = state.suggests ?? !!state.focus;
}

let zoom = 1;
function applyZoom() {
  const el = document.getElementById("diagram");
  el.style.transform = `scale(${zoom})`;
  const svg = el.querySelector("svg");
  if (svg) {
    // keep the scroll area in step with the scaled drawing
    const w = Number(svg.getAttribute("width")) || svg.getBoundingClientRect().width / zoom;
    const hgt = Number(svg.getAttribute("height")) || svg.getBoundingClientRect().height / zoom;
    el.parentElement.style.setProperty("--w", w * zoom + "px");
    el.style.marginBottom = (hgt * zoom - hgt) + "px";
    el.style.marginRight = (w * zoom - w) + "px";
  }
  document.getElementById("zoomPct").textContent = Math.round(zoom * 100) + "%";
}
function fit() {
  const svg = document.querySelector("#diagram svg");
  const canvas = document.getElementById("canvas");
  if (!svg) return;
  const w = Number(svg.getAttribute("width")) || svg.getBBox().width;
  const hgt = Number(svg.getAttribute("height")) || svg.getBBox().height;
  const avail = canvas.clientWidth - 40;
  const availH = canvas.clientHeight - 40;
  zoom = Math.min(1, avail / w, Math.max(0.25, availH / hgt));
  applyZoom();
}
document.getElementById("btnFit").addEventListener("click", fit);
document.getElementById("btnZoomIn").addEventListener("click", () => { zoom = Math.min(3, zoom * 1.25); applyZoom(); });
document.getElementById("btnZoomOut").addEventListener("click", () => { zoom = Math.max(0.1, zoom / 1.25); applyZoom(); });
document.getElementById("canvas").addEventListener("wheel", (e) => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  zoom = Math.min(3, Math.max(0.1, zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
  applyZoom();
}, { passive: false });

function select(id) {
  state.focus = id;
  syncSuggestBox();
  document.querySelectorAll("#list li").forEach((li) => li.classList.toggle("active", li.dataset.id === id));
  document.querySelector("#list li.active")?.scrollIntoView({ block: "nearest" });
  showDetail(id);
  render();
}

function showAll() {
  state.focus = null;
  syncSuggestBox();
  document.querySelectorAll("#list li").forEach((li) => li.classList.remove("active"));
  document.getElementById("detail").innerHTML = '<p class="path">Whole library. Click a skill to see what it calls and why.</p><div id="unresolved"></div>';
  renderUnresolved();
  render();
}

function h(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function showDetail(id) {
  const n = byId.get(id);
  if (!n) return;
  const out = graph.edges.filter((e) => e.source === id);
  const inc = graph.edges.filter((e) => e.target === id);
  const flows = graph.flows.filter((f) => f.owner === id || f.steps.includes(id));
  const modeWord = { auto: "auto", manual: "manual-only", background: "model-only" }[n.mode];
  const edgeHtml = (e, dir) => {
    const other = dir === "out" ? e.target : e.source;
    const ev = e.evidence.map((v) => `<div class="ev"><b>L${v.line}</b> ${h(v.snippet)}</div>`).join("");
    return `<div class="edge"><span class="t" data-go="${h(other)}">${dir === "out" ? "→" : "←"} ${h(byId.get(other)?.name ?? other)}</span><span class="k">${e.type}</span>${e.warning ? '<span class="w">⚠ manual-only target: the model may not be able to invoke it</span>' : ""}${ev}</div>`;
  };
  const flowHtml = (f) => {
    const steps = f.steps.map((s) => `<span class="t" data-go="${h(s)}">${h(byId.get(s)?.name ?? s)}</span>`).join(f.kind === "parallel" ? " ⫴ " : " → ");
    const ev = f.evidence.map((v) => `<div class="ev"><b>L${v.line}</b> ${h(v.snippet)}</div>`).join("");
    const icon = { sequential: "⇢", parallel: "⫴", loop: "↻" }[f.kind];
    return `<div class="edge">${icon} <b>${h(f.kind)}</b> in ${h(byId.get(f.owner)?.name ?? f.owner)}: ${steps}${f.until ? `<div class="k">until ${h(f.until)}</div>` : ""}${ev}</div>`;
  };
  const fm = Object.entries(n.frontmatter).filter(([k]) => !["name", "description"].includes(k));
  const inv = `Claude: ${n.invocation.claude}${n.invocation.codex === "manual" ? " · Codex: manual-only ($" + h(n.name) + ")" : " · Codex: $" + h(n.name)}`;
  document.getElementById("detail").innerHTML = `
    <h2>${h(n.name)}</h2>
    <div><span class="badge ${n.mode}">${modeWord}</span>${n.entry ? '<span class="badge entry">▶ entry point</span>' : ""}${n.subSkill ? '<span class="badge sub">↳ sub-skill</span>' : ""}</div>
    <p class="desc">${h(n.description) || "<i>no description</i>"}</p>
    <div class="path">${inv}</div>
    <div class="path">${h(n.file)} · ${n.bodyLines} body lines${n.argumentHint ? " · args: <code>" + h(n.argumentHint) + "</code>" : ""}</div>
    ${n.allowedTools ? `<div class="path">allowed-tools: ${n.allowedTools.map((t) => "<code>" + h(t) + "</code>").join(" ")}</div>` : ""}
    <h3>Calls / points to (${out.length})</h3>${out.map((e) => edgeHtml(e, "out")).join("") || '<div class="path">nothing found in the body</div>'}
    <h3>Called / pointed to by (${inc.length})</h3>${inc.map((e) => edgeHtml(e, "in")).join("") || '<div class="path">no incoming links</div>'}
    <h3>Flows (${flows.length})</h3>${flows.map(flowHtml).join("") || '<div class="path">no sequential, parallel or loop structure found</div>'}
    ${n.scripts.length || n.references.length ? `<h3>Files</h3><div class="path">${[...n.scripts.map((s) => "scripts/" + s), ...n.references.map((r) => "references/" + r)].map(h).join("<br/>")}</div>` : ""}
    ${fm.length ? `<details><summary>frontmatter</summary><pre>${h(JSON.stringify(Object.fromEntries(fm), null, 2))}</pre></details>` : ""}
  `;
  document.querySelectorAll("#detail [data-go]").forEach((el) => el.addEventListener("click", () => select(el.dataset.go)));
}

function renderUnresolved() {
  const el = document.getElementById("unresolved");
  if (!el || !graph.unresolved.length) return;
  el.innerHTML = `<details><summary>${graph.unresolved.length} mentioned names not in this library</summary>` +
    graph.unresolved.map((u) => `<div>/${h(u.name)} <span class="k">×${u.count} in ${u.sources.map(h).join(", ")}</span></div>`).join("") + "</details>";
}

function buildList(filter = "") {
  const q = filter.trim().toLowerCase();
  const ul = document.getElementById("list");
  const order = (n) => (n.entry ? 0 : n.mode === "manual" ? 1 : n.mode === "auto" ? 2 : 3);
  const nodes = graph.nodes.filter((n) => !q || n.id.includes(q) || n.name.toLowerCase().includes(q) || n.description.toLowerCase().includes(q))
    .sort((a, b) => order(a) - order(b) || a.name.localeCompare(b.name));
  ul.innerHTML = nodes.map((n) => `<li data-id="${h(n.id)}" class="${state.focus === n.id ? "active" : ""}"><span class="dot ${n.mode}"></span><span class="nm">${n.entry ? "▶ " : n.subSkill ? "↳ " : ""}${h(n.name)}</span><div class="ds">${h(n.description)}</div></li>`).join("");
  ul.querySelectorAll("li").forEach((li) => li.addEventListener("click", () => select(li.dataset.id)));
}

document.getElementById("counts").textContent = `${graph.meta.skillCount} skills · ${graph.meta.edgeCount} edges · ${graph.meta.flowCount} flows · ${graph.nodes.filter((n) => n.entry).length} entry points`;
document.getElementById("search").addEventListener("input", (e) => buildList(e.target.value));
document.getElementById("btnAll").addEventListener("click", showAll);
document.getElementById("optFlows").addEventListener("change", (e) => { state.flows = e.target.checked; render(); });
document.getElementById("optSug").addEventListener("change", (e) => { state.suggests = e.target.checked; render(); });
document.getElementById("optRefs").addEventListener("change", (e) => { state.references = e.target.checked; render(); });
document.getElementById("optFiles").addEventListener("change", (e) => { state.files = e.target.checked; render(); });
document.getElementById("optTB").addEventListener("change", (e) => { state.direction = e.target.checked ? "TB" : "LR"; render(); });
document.getElementById("btnCopy").addEventListener("click", async () => {
  const code = toMermaid(graph, { ...currentOptions(), html: false });
  try { await navigator.clipboard.writeText(code); document.getElementById("btnCopy").textContent = "Copied!"; }
  catch { prompt("Copy the Mermaid code:", code); }
  setTimeout(() => (document.getElementById("btnCopy").textContent = "Copy Mermaid"), 1200);
});
const download = (name, text, type) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); };
document.getElementById("btnMmd").addEventListener("click", () => download((state.focus ?? "graph") + ".mmd", toMermaid(graph, { ...currentOptions(), html: false }), "text/plain"));
document.getElementById("btnJson").addEventListener("click", () => download("graph.json", JSON.stringify(graph, null, 2), "application/json"));

buildList();
renderUnresolved();
const initial = new URLSearchParams(location.search).get("skill");
if (initial && byId.has(initial)) select(initial); else render();

if (WATCH) {
  const w = document.getElementById("watch");
  w.textContent = "watching…";
  let seen = null;
  setInterval(async () => {
    try {
      const r = await fetch("/__version", { cache: "no-store" });
      const v = (await r.text()).trim();
      if (seen === null) seen = v;
      else if (v !== seen) location.reload();
    } catch { w.textContent = "watch: server gone"; }
  }, 1000);
}
</script>
</body>
</html>
